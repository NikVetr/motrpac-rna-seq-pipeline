include required(classpath("application"))

google {
  application-name = "motrpac-rnaseq"
  cloud-sdk-image-url = "gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:42e14bcb246ca97a41ac0d1aabc654e38246d31da34596387685f411111c0f49"
  cloud-sdk-image-size-gb = 1

  auths = [
    {
      name = "application-default"
      scheme = "application_default"
    }
  ]
}

engine {
  filesystems {
    gcs {
      auth = "application-default"
      project = ${?MOTRPAC_GCP_PROJECT}
    }
  }
}

system {
  abort-jobs-on-terminate = true
  max-concurrent-workflows = 1
  max-workflow-launch-count = 1
  max-scatter-width-per-scatter = 1
  total-max-jobs-per-root-workflow = 25
}

# The first benchmark is intentionally cold. Durable call caching requires a
# persistent Cromwell database and will be tested as a separate recovery arm.
call-caching {
  enabled = false
}

backend {
  default = "GCPBATCH"

  providers {
    GCPBATCH {
      actor-factory = "cromwell.backend.google.batch.GcpBatchBackendLifecycleActorFactory"

      config {
        project = ${?MOTRPAC_GCP_PROJECT}
        root = ${?MOTRPAC_GCP_BATCH_ROOT}
        concurrent-job-limit = 3
        maximum-polling-interval = 60
        batch-timeout = 4 hours

        batch {
          auth = "application-default"
          compute-service-account = ${MOTRPAC_GCP_COMPUTE_SERVICE_ACCOUNT}
          location = ${?MOTRPAC_GCP_BATCH_LOCATION}
        }

        # The project's default VPC uses custom subnet creation, so Batch must
        # receive an explicit regional subnet rather than an empty value.
        virtual-private-cloud {
          network-name = "default"
          subnetwork-name = "projects/${projectId}/regions/*/subnetworks/default"
        }

        filesystems {
          gcs {
            auth = "application-default"
            project = ${?MOTRPAC_GCP_PROJECT}

            caching {
              duplication-strategy = "copy"
            }
          }
        }

        default-runtime-attributes {
          failOnStderr: false
          continueOnReturnCode: 0
          preemptible: 0
        }
      }
    }
  }
}
